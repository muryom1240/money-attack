name: Auto Blog Post & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # 毎日日本時間 朝7時（UTC 22:00）に実行
    - cron: '0 22 * * *'
  # 手動でも実行できるようにする
  workflow_dispatch:

# GitHub Pagesへのデプロイ権限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/auto-blog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./apps/auto-blog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate AI Blog Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npm run generate:post

      - name: Commit newly generated post
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/blog/ src/assets/
          # 変更がある場合のみコミット
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generated AI blog post" && git push)


      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/auto-blog/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
